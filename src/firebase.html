<!-- Connexion par e-mail + mot de passe et base Firestore partagée (site web uniquement) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-block:24px;padding-inline:16px}
.login-box{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.login-box p{margin:0;color:var(--ink-2);font-size:14px}
.login-msg{border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;background:var(--ko-soft);color:var(--ko)}
.login-msg.ok{background:var(--ok-soft);color:var(--ok)}
.acct{display:flex;flex-direction:column;gap:6px;padding-inline:8px;font-size:12px;color:var(--ink-3);min-width:0}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:860px){.acct{flex-direction:row;align-items:center;padding-inline:0}.acct span{display:none}}
</style>
<div class="login" id="login" hidden>
  <form class="login-box" id="login-form">
    <div class="brand-mark">Faruk<span>·</span>Auto</div>
    <p>Connectez-vous pour retrouver les voitures, les marges et le bilan partagés entre associés.</p>
    <div class="login-msg" id="login-msg" hidden></div>
    <div class="field"><label for="login-mail">Adresse e-mail</label><input id="login-mail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="login-pass">Mot de passe</label><input id="login-pass" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" id="login-go" type="submit">Se connecter</button>
    <button class="btn ghost sm" id="login-reset" type="button">Mot de passe oublié</button>
    <button class="btn ghost sm" id="login-out" type="button" hidden>Changer de compte</button>
  </form>
</div>
<script>
(function () {
  const cfg = window.FIREBASE_CONFIG || {};
  const configured = !!(window.firebase && cfg.apiKey && !/^COLLER/.test(cfg.apiKey));
  let auth = null, started = false;
  const $id = id => document.getElementById(id);

  function msg(text, ok) {
    const el = $id('login-msg');
    el.hidden = !text; el.textContent = text || ''; el.classList.toggle('ok', !!ok);
  }
  function show(text, denied) {
    $id('login').hidden = false;
    msg(text, false);
    $id('login-go').hidden = !!denied;
    $id('login-reset').hidden = !!denied;
    $id('login-out').hidden = !denied;
  }
  function errMsg(e) {
    const c = e && e.code;
    if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found') return 'E-mail ou mot de passe incorrect.';
    if (c === 'auth/invalid-email') return 'Adresse e-mail non valide.';
    if (c === 'auth/too-many-requests') return 'Trop de tentatives. Attendez quelques minutes.';
    if (c === 'auth/network-request-failed') return 'Pas de connexion internet.';
    if (c === 'auth/operation-not-allowed') return 'Activez « E-mail/Mot de passe » dans Firebase > Authentication.';
    return 'Connexion impossible (' + c + ').';
  }
  function account(u) {
    if (document.querySelector('.acct')) return;
    const el = document.createElement('div');
    el.className = 'acct';
    el.innerHTML = '<span></span><button class="btn ghost sm" type="button">Se déconnecter</button>';
    el.querySelector('span').textContent = u.email;
    el.querySelector('button').onclick = () => auth.signOut();
    document.querySelector('.side').appendChild(el);
  }

  window.faBackend = {
    configured,
    start() {
      return new Promise(resolve => {
        firebase.initializeApp(cfg);
        auth = firebase.auth();
        $id('login-form').addEventListener('submit', e => {
          e.preventDefault();
          $id('login-go').disabled = true; msg('');
          auth.signInWithEmailAndPassword($id('login-mail').value.trim(), $id('login-pass').value)
            .catch(err => msg(errMsg(err)))
            .finally(() => { $id('login-go').disabled = false; });
        });
        $id('login-reset').onclick = () => {
          const mail = $id('login-mail').value.trim();
          if (!mail) return msg('Saisissez d\'abord votre adresse e-mail.');
          auth.sendPasswordResetEmail(mail)
            .then(() => msg('E-mail de réinitialisation envoyé à ' + mail + '.', true))
            .catch(err => msg(errMsg(err)));
        };
        $id('login-out').onclick = () => auth.signOut();
        auth.onAuthStateChanged(u => {
          if (u) {
            $id('login').hidden = true; $id('login-pass').value = ''; account(u);
            if (!started) { started = true; resolve(firebase.firestore()); }
          } else if (started) {
            location.reload();
          } else {
            show();
          }
        });
      });
    },
    denied() {
      const u = auth && auth.currentUser;
      show('Le compte ' + (u ? u.email : '') + ' n\'a pas accès à la base. Son identifiant doit être ajouté dans les règles Firebase.', true);
    },
  };
})();
</script>
